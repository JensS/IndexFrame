<VirtualHost *:80>
    DocumentRoot /webspace/project/public
    <Directory /webspace/project/public>
        AllowOverride All
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
