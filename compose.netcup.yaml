name: indexframe-netcup

x-application: &application
    APP_NAME: Indexframe
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: http://localhost:8085
    APP_KEY: ${NETCUP_LOCAL_APP_KEY:?Set NETCUP_LOCAL_APP_KEY in .env.netcup.local}
    EAGLE_PASSWORD_HASH: ${NETCUP_LOCAL_PASSWORD_HASH:?Set NETCUP_LOCAL_PASSWORD_HASH in .env.netcup.local}
    EAGLE_WEBDAV_URL: ${NETCUP_LOCAL_WEBDAV_URL:-http://webdav/}
    EAGLE_WEBDAV_USERNAME: ${NETCUP_LOCAL_WEBDAV_USERNAME:-local}
    EAGLE_WEBDAV_PASSWORD: ${NETCUP_LOCAL_WEBDAV_PASSWORD:-local-test-token}
    EAGLE_WEBDAV_ROOT: ${NETCUP_LOCAL_WEBDAV_ROOT:-/}
    EAGLE_WEBDAV_VERIFY_TLS: "true"
    EAGLE_FFMPEG_PATH: ""
    EAGLE_FFPROBE_PATH: ""
    EAGLE_QUEUED_SYNC: "true"
    EAGLE_SYNC_BATCH_SIZE: "5"
    EAGLE_WRITES_ENABLED: "false"
    EAGLE_UPLOAD_MAX_KILOBYTES: "122880"
    EAGLE_UPLOAD_REQUEST_MAX_KILOBYTES: "122880"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_DATABASE: indexframe
    DB_USERNAME: indexframe
    DB_PASSWORD: local-test-password
    DB_CHARSET: utf8mb4
    DB_COLLATION: utf8mb4_unicode_ci
    DB_QUEUE_RETRY_AFTER: "240"
    CACHE_STORE: database
    SESSION_DRIVER: database
    SESSION_ENCRYPT: "true"
    SESSION_SECURE_COOKIE: "false"
    QUEUE_CONNECTION: database
    LOG_CHANNEL: single
    LOG_LEVEL: warning

services:
    web:
        build:
            context: .
            dockerfile: docker/netcup/Dockerfile
            target: web
        environment: *application
        ports:
            - 127.0.0.1:8085:80
        volumes:
            - storage:/webspace/project/storage
        depends_on:
            mysql:
                condition: service_healthy

    cli:
        build:
            context: .
            dockerfile: docker/netcup/Dockerfile
            target: cli
        environment: *application
        volumes:
            - storage:/project/storage
        depends_on:
            mysql:
                condition: service_healthy
        profiles: [tools]

    tests:
        build:
            context: .
            dockerfile: docker/netcup/Dockerfile
            target: test
        environment:
            <<: *application
            APP_ENV: testing
            DB_DATABASE: indexframe_testing
            SESSION_SECURE_COOKIE: "false"
            EAGLE_WRITES_ENABLED: "true"
            # Unit/feature tests use local files, never production credentials.
            EAGLE_WEBDAV_URL: http://webdav/
            EAGLE_WEBDAV_USERNAME: local
            EAGLE_WEBDAV_PASSWORD: local-test-token
            EAGLE_WEBDAV_ROOT: /
            CACHE_STORE: array
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
        depends_on:
            mysql:
                condition: service_healthy
        profiles: [tools]

    mysql:
        image: mysql:8.4
        command: [--character-set-server=latin1, --collation-server=latin1_swedish_ci]
        environment:
            MYSQL_DATABASE: indexframe
            MYSQL_USER: indexframe
            MYSQL_PASSWORD: local-test-password
            MYSQL_ROOT_PASSWORD: local-root-password
        volumes:
            - mysql:/var/lib/mysql
            - ./docker/netcup/mysql-init.sql:/docker-entrypoint-initdb.d/indexframe.sql:ro
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
                    --database="$$MYSQL_DATABASE" --execute='SELECT 1' --batch --skip-column-names
            interval: 5s
            timeout: 5s
            retries: 30

    webdav:
        build:
            context: .
            dockerfile: docker/netcup/WebDAV.Dockerfile
        volumes:
            - ./tests/Fixtures/netcup-webdav:/var/lib/dav/data:ro

volumes:
    storage:
    mysql:
